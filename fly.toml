app = "vrai-bot"
primary_region = "cdg"

[build]

[env]
  FREQTRADE__DRY_RUN = "true"

[processes]
  app = "trade --config user_data/config.json --strategy SampleStrategy"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"
